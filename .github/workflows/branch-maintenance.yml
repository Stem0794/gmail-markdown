name: Branch maintenance

on:
  push:
    branches: [agent/security-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/security-hardening
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch E2E runtime paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/e2e/markdown.spec.js')
          text = p.read_text()
          text = text.replace(
              "const MARKED_JS = path.resolve(__dirname, '../../marked.min.js');",
              "const MARKED_JS = path.resolve(__dirname, '../../vendor/marked.umd.js');"
          )
          text = text.replace(
              "const EMOJI_JS = path.resolve(__dirname, '../../emoji.js');\nconst CONTENT_JS = path.resolve(__dirname, '../../contentScript.js');\nconst INJECTOR_JS = path.resolve(__dirname, '../../injector.js');",
              "const EMOJI_JS = path.resolve(__dirname, '../../emoji.js');\nconst SECURITY_JS = path.resolve(__dirname, '../../markdownSecurity.js');\nconst CONTENT_JS = path.resolve(__dirname, '../../contentScript.js');"
          )
          text = text.replace(
              "  await page.addScriptTag({ path: MARKED_JS });\n  await page.addScriptTag({ path: EMOJI_JS });\n  await page.addScriptTag({ path: CONTENT_JS });",
              "  await page.addScriptTag({ path: MARKED_JS });\n  await page.addScriptTag({ path: EMOJI_JS });\n  await page.addScriptTag({ path: SECURITY_JS });\n  await page.addScriptTag({ path: CONTENT_JS });",
              1
          )
          start = text.find("test('context-menu injector keeps raw HTML literal while converting Markdown'")
          marker = text.find('// ─── Auto-format disabled', start)
          if start != -1 and marker != -1:
              replacement = """test('static runtime path keeps raw HTML literal while converting Markdown', async ({ page }) => {\n  await setupPage(page);\n  await setEditorText(page, '**safe** <img src=x> <javascript:alert(1)>');\n  await page.keyboard.press('Control+Shift+M');\n\n  await expect(page.locator(`${EDITOR} strong`)).toBeAttached();\n  await expect(page.locator(`${EDITOR} img`)).toHaveCount(0);\n  await expect(page.locator(`${EDITOR} a[href^=\"javascript:\"]`)).toHaveCount(0);\n  await expect(page.locator(EDITOR)).toContainText('<img src=x>');\n});\n\n"""
              text = text[:start] + replacement + text[marker:]
          p.write_text(text)
          PY
      - name: Generate exact dependency lockfile
        run: npm install --package-lock-only
      - name: Commit maintenance changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/e2e/markdown.spec.js package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update E2E runtime paths and dependency lockfile'
          git push origin HEAD:agent/security-hardening
