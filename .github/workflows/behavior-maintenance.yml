name: Behavior maintenance

on:
  push:
    branches: [agent/security-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/security-hardening
      - name: Apply targeted behavior fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('contentScript.js')
          text = p.read_text()
          old = """    // Absolute fallback: first editor on page\n    return document.querySelector(SELECTOR);"""
          new = """    // Do not guess when multiple Gmail drafts may be open.\n    return null;"""
          if old not in text:
              raise SystemExit('active-editor fallback pattern not found')
          text = text.replace(old, new, 1)

          old = """      const text = e.clipboardData.getData('text/plain');\n      if (!text) return;\n      e.preventDefault();"""
          new = """      const text = e.clipboardData.getData('text/plain');\n      if (!text) return;\n      const html = e.clipboardData.getData('text/html');\n      // Preserve Gmail's native rich-content paste unless Markdown conversion was requested.\n      if (!opts.convertOnPaste && html) return;\n      e.preventDefault();"""
          if old not in text:
              raise SystemExit('paste pattern not found')
          text = text.replace(old, new, 1)

          old = """    scanAndAttach();\n\n    const observer = new MutationObserver(() => scanAndAttach());\n    observer.observe(document.body, { childList: true, subtree: true });"""
          new = """    scanAndAttach();\n\n    let scanScheduled = false;\n    const scheduleScan = () => {\n      if (scanScheduled) return;\n      scanScheduled = true;\n      window.setTimeout(() => {\n        scanScheduled = false;\n        scanAndAttach();\n      }, 0);\n    };\n    const observer = new MutationObserver(scheduleScan);\n    observer.observe(document.body, { childList: true, subtree: true });"""
          if old not in text:
              raise SystemExit('central observer pattern not found')
          text = text.replace(old, new, 1)

          old = """      applyTheme(opts.theme);\n      setupCentralObserver(opts);\n\n      document.addEventListener('keydown', (e) => {"""
          new = """      applyTheme(opts.theme);\n      setupCentralObserver(opts);\n\n      if (chrome.storage.onChanged && typeof chrome.storage.onChanged.addListener === 'function') {\n        chrome.storage.onChanged.addListener((changes, areaName) => {\n          if (areaName !== 'sync') return;\n          Object.keys(DEFAULTS).forEach((key) => {\n            if (changes[key]) opts[key] = changes[key].newValue ?? DEFAULTS[key];\n          });\n          if (changes.theme) applyTheme(opts.theme);\n        });\n      }\n\n      document.addEventListener('keydown', (e) => {"""
          if old not in text:
              raise SystemExit('storage listener insertion pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('threadCopy.js')
          text = p.read_text()
          old = """  const observer = new MutationObserver(function () {\n    if (!document.getElementById(BTN_ID) && document.querySelector('h2.hP')) {\n      injectButton();\n    }\n  });\n\n  observer.observe(document.body, { childList: true, subtree: true });"""
          new = """  let injectionScheduled = false;\n  const observer = new MutationObserver(function () {\n    if (injectionScheduled) return;\n    injectionScheduled = true;\n    window.setTimeout(function () {\n      injectionScheduled = false;\n      if (!document.getElementById(BTN_ID) && document.querySelector('h2.hP')) {\n        injectButton();\n      }\n    }, 0);\n  });\n\n  observer.observe(document.body, { childList: true, subtree: true });"""
          if old not in text:
              raise SystemExit('thread observer pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit behavior fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contentScript.js threadCopy.js
          git commit -m 'Improve editor targeting, paste behavior, and observers'
          git push origin HEAD:agent/security-hardening
